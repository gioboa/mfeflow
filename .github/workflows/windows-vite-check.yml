# Temporary, for PR #76: one real Vite shell build (and its browser test) on Windows.
# Lives only on this branch of the fork; never merged.
name: windows vite check

on:
  push:
    branches: [ci/windows-vite-check]
  workflow_dispatch:

permissions: {}

jobs:
  windows:
    name: windows ${{ matrix.combo }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # vite-r1: the bare project. The other one has the runtime plugins, env-t3 and the Playwright test.
        combo: [vite-r1, vite-lint-url-env-testing-ci-r3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @storefront/e2e exec playwright install --with-deps chromium
      - run: node e2e/matrix/run.ts ${{ matrix.combo }}
        env:
          MATRIX_DIR: ${{ runner.temp }}
